name: Pterodactyl Auto Backup & Persistent

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Restore Data from Previous Session
        run: |
          if [ -d "ptero-data/var" ]; then
            echo "Memulihkan data lama..."
            sudo mkdir -p /opt/pterodactyl/panel
            sudo cp -r ptero-data/* /opt/pterodactyl/panel/
            echo "Data berhasil dipulihkan!"
          else
            echo "Belum ada data sebelumnya, mulai bersih."
          fi

      - name: Deploy Pterodactyl Panel
        run: |
          sudo mkdir -p /opt/pterodactyl
          cd /opt/pterodactyl

          cat << 'EOF' > docker-compose.yml
          version: '3.8'
          networks:
            pterodactyl:
              driver: bridge
          services:
            panel:
              image: ghcr.io/pterodactyl/panel:latest
              container_name: pterodactyl-panel
              restart: always
              ports:
                - "80:80"
              environment:
                - APP_ENV=production
                - APP_TIMEZONE=Asia/Jakarta
              volumes:
                - /opt/pterodactyl/panel/var/:/app/var/
                - /opt/pterodactyl/panel/storage/:/app/storage/
              networks:
                - pterodactyl
          EOF

          # Jalankan container dan tunggu sampai benar-benar UP
          sudo docker compose up -d

      # 1. Tunggu Docker benar-benar siap merespons di port 80 (Maksimal 2 menit)
      - name: Wait for Panel to be Ready
        run: |
          echo "Menunggu Docker Pterodactyl siap..."
          for i in {1..24}; do
            if curl -s http://localhost:80 > /dev/null; then
              echo "Panel Pterodactyl sudah aktif di port 80!"
              exit 0
            fi
            echo "Percobaan ke-$i: Panel belum siap, tunggu 5 detik..."
            sleep 5
          echo "Peringatan: Panel agak lama merespons, tapi kita lanjut jalankan tunnel..."
          done

      # 2. Jalankan Cloudflare Quick Tunnel setelah aplikasi siap
      - name: Start Cloudflare Quick Tunnel
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:80 > cf_log.txt 2>&1 &
          sleep 5

      - name: Show Public Access Link
        run: |
          echo "===================================================="
          echo " PTERODACTYL PANEL (UBUNTU 24.04) ONLINE!"
          echo "===================================================="
          cat cf_log.txt | grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com"
          echo "===================================================="

      - name: Run Background Auto-Backup Daemon
        run: |
          cat << 'EOF' > /tmp/auto_backup.sh
          while true; do
            sleep 1800
            mkdir -p ptero-data
            sudo cp -r /opt/pterodactyl/panel/* ptero-data/ 2>/dev/null || true
            sudo chown -R $USER:$USER ptero-data/
            git add ptero-data/
            git commit -m "Auto-backup: $(date +'%Y-%m-%d %H:%M:%S')" || true
            git push origin HEAD:${{ github.ref_name }} || true
          done
          EOF
          chmod +x /tmp/auto_backup.sh
          nohup /tmp/auto_backup.sh > /dev/null 2>&1 &

          for i in {1..35}; do
            sleep 600
          done

          echo "Sesi hampir habis, melakukan backup final..."
          mkdir -p ptero-data
          sudo cp -r /opt/pterodactyl/panel/* ptero-data/ || true
          sudo chown -R $USER:$USER ptero-data/
          git add ptero-data/
          git commit -m "Final backup sebelum sesi mati: $(date +'%Y-%m-%d %H:%M:%S')" || true
          git push origin HEAD:${{ github.ref_name }} || true
