name: Pterodactyl Auto Backup & Persistent

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 360 # Maksimal 6 jam per sesi

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Konfigurasi Git Identity untuk Auto Commit Backup
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 2. Auto Restore Data dari Sesi Sebelumnya (jika foldernya ada di repo)
      - name: Restore Data from Previous Session
        run: |
          if [ -d "ptero-data/var" ]; then
            echo "Memulihkan data lama..."
            sudo mkdir -p /opt/pterodactyl/panel
            sudo cp -r ptero-data/* /opt/pterodactyl/panel/
            echo "Data berhasil dipulihkan!"
          else
            echo "Belum ada data sebelumnya, mulai bersih."
          fi

      # 3. Setup Docker & Jalankan Pterodactyl
      - name: Deploy Pterodactyl Panel
        run: |
          sudo mkdir -p /opt/pterodactyl
          cd /opt/pterodactyl

          cat << 'EOF' > docker-compose.yml
          version: '3.8'
          networks:
            pterodactyl:
              driver: bridge
          services:
            panel:
              image: ghcr.io/pterodactyl/panel:latest
              container_name: pterodactyl-panel
              restart: always
              ports:
                - "80:80"
              environment:
                - APP_ENV=production
                - APP_TIMEZONE=Asia/Jakarta
              volumes:
                - /opt/pterodactyl/panel/var/:/app/var/
                - /opt/pterodactyl/panel/storage/:/app/storage/
              networks:
                - pterodactyl
          EOF

          sudo docker compose up -d

      # 4. Jalankan Cloudflare Quick Tunnel
      - name: Start Cloudflare Quick Tunnel
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:80 > cf_log.txt 2>&1 &
          sleep 5

      # 5. Tampilkan Link Akses Web
      - name: Show Public Access Link
        run: |
          echo "===================================================="
          echo " PTERODACTYL PANEL (UBUNTU 24.04) ONLINE!"
          echo "===================================================="
          cat cf_log.txt | grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com"
          echo "===================================================="

      # 6. Skrip Auto Backup Berkala & Saat Sesi Mau Habis
      - name: Run Background Auto-Backup Daemon
        run: |
          # Buat skrip backup yang berjalan di background setiap 30 menit
          cat << 'EOF' > /tmp/auto_backup.sh
          while true; do
            sleep 1800 # Setiap 30 menit
            echo "[$(date)] Melakukan auto-backup data ke git..."
            
            # Ambil data dari direktori docker ke folder lokal repo
            mkdir -p ptero-data
            sudo cp -r /opt/pterodactyl/panel/* ptero-data/ 2>/dev/null || true
            sudo chown -R $USER:$USER ptero-data/
            
            git add ptero-data/
            git commit -m "Auto-backup: $(date +'%Y-%m-%d %H:%M:%S')" || true
            git push origin HEAD:${{ github.ref_name }} || true
          done
          EOF
          
          chmod +x /tmp/auto_backup.sh
          nohup /tmp/auto_backup.sh > /dev/null 2>&1 &
          echo "Auto-backup daemon aktif di background!"

          # Menjaga server tetap hidup, dan melakukan backup terakhir pas mau timeout (mendekati 6 jam)
          # Mengatur tidur bertahap agar aman
          for i in {1..35}; do
            sleep 600 # Tidur per 10 menit (total 350 menit, sisa waktu untuk backup akhir)
          done

          echo "Sesi hampir habis, melakukan backup final..."
          mkdir -p ptero-data
          sudo cp -r /opt/pterodactyl/panel/* ptero-data/ || true
          sudo chown -R $USER:$USER ptero-data/
          git add ptero-data/
          git commit -m "Final backup sebelum sesi mati: $(date +'%Y-%m-%d %H:%M:%S')" || true
          git push origin HEAD:${{ github.ref_name }} || true
          echo "Backup final selesai!"
